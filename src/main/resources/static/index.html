<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stockdspr 테스트 콘솔</title>
<!--
  개발용 테스트 화면 (React 프론트가 나오면 지워도 됨)
  서버를 켜고 http://localhost:8080/ 으로 열면 같은 주소라 CORS 설정 없이 동작한다.
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6ea;
    --accent: #2f6fde; --accent-text: #ffffff; --danger: #c93a3a; --ok: #1f8a4c; --warn: #b7791f;
    --chip: #eef2f7; --sel: #e8f0fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1c2027; --text: #e6e8eb; --muted: #9aa3af; --line: #2c323b;
      --accent: #5b8ff0; --accent-text: #0e1116; --danger: #ef6b6b; --ok: #46c27e; --warn: #e0b04f;
      --chip: #262c35; --sel: #22314d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); margin: 0; flex: 1 1 260px; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px 20px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .wide { grid-column: 1 / -1; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 32px; } }
  h2 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h2 .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  tr.clickable { cursor: pointer; }
  tr.selected td { background: var(--sel); }
  .empty { color: var(--muted); padding: 10px 8px; }
  form.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 12px; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; color: inherit; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
  input.qty { width: 64px; }
  input.key { width: 130px; }
  button { border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { filter: brightness(0.97); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  .actions { display: flex; gap: 6px; align-items: center; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
  .badge.HELD { color: var(--warn); } .badge.CONFIRMED { color: var(--ok); }
  .badge.REJECTED, .badge.CANCELLED, .badge.EXPIRED, .badge.NOT_IN_USE, .badge.SUSPENDED { color: var(--muted); }
  .badge.IN_USE, .badge.ACTIVE { color: var(--ok); }
  .muted { color: var(--muted); }
  #log ol { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
  #log li { border-bottom: 1px solid var(--line); padding: 6px 0; }
  #log .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  #log .st { font-weight: 600; } #log .st.ok { color: var(--ok); } #log .st.err { color: var(--danger); }
  #log pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--muted); }
  #toast { position: fixed; right: 16px; bottom: 16px; max-width: min(420px, calc(100vw - 32px)); padding: 10px 14px;
           border-radius: 8px; background: var(--text); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; } #toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>stockdspr 테스트 콘솔</h1>
  <p class="sub">개발용 화면입니다. 품목을 고르면 재고가, 지점을 고르면 그 지점의 예약이 나옵니다.</p>
  <a href="/swagger-ui/index.html" target="_blank" rel="noopener">Swagger</a>
  <button id="refreshAll">전체 새로고침</button>
</header>

<main>
  <section class="card" id="facilitySection">
    <h2>지점</h2>
    <div class="scroll"><table>
      <thead><tr><th>id</th><th>이름</th><th>주소</th><th>좌표</th><th>상태</th><th></th></tr></thead>
      <tbody id="facilityRows"></tbody>
    </table></div>
    <form class="inline" id="facilityForm">
      <label>이름*<input name="facilityName" required></label>
      <label>주소*<input name="address" required></label>
      <label>위도<input name="latitude" type="number" step="any" style="width:100px"></label>
      <label>경도<input name="longitude" type="number" step="any" style="width:100px"></label>
      <button class="primary">지점 추가</button>
    </form>
  </section>

  <section class="card" id="itemSection">
    <h2>품목 <span class="hint">행을 누르면 선택</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>id</th><th>이름</th><th>성분</th><th>보관 조건</th><th></th></tr></thead>
      <tbody id="itemRows"></tbody>
    </table></div>
    <form class="inline" id="itemForm">
      <label>이름*<input name="name" required></label>
      <label>성분<input name="ingredients"></label>
      <label>보관 조건<input name="storageConditions"></label>
      <button class="primary">품목 추가</button>
    </form>
  </section>

  <section class="card wide" id="stockSection">
    <h2>재고 <span class="hint" id="stockTitle">품목을 먼저 선택하세요</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>id</th><th>현재</th><th>예약</th><th>가용</th><th>유효기간</th><th>상태</th><th>예약하기</th><th></th></tr></thead>
      <tbody id="stockRows"></tbody>
    </table></div>
    <form class="inline" id="stockForm">
      <label>지점*<select name="facilityId" id="stockFacility" required></select></label>
      <label>수량*<input name="onHandQty" type="number" min="0" required style="width:90px"></label>
      <label>유효기간<input name="expirationDate" type="date"></label>
      <button class="primary">재고 추가</button>
    </form>
  </section>

  <section class="card wide" id="reservationSection">
    <h2>예약
      <select id="resFacility" aria-label="예약을 볼 지점"></select>
      <span class="hint">HELD는 10분 뒤 만료, 스케줄러가 1분마다 정리</span>
    </h2>
    <div class="scroll"><table>
      <thead><tr><th>id</th><th>재고 id</th><th>수량</th><th>상태</th><th>만료</th><th></th></tr></thead>
      <tbody id="reservationRows"></tbody>
    </table></div>
  </section>

  <section class="card wide" id="log">
    <h2>요청 기록
      <label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="logGets"> 조회(GET)도 기록</label>
      <button class="small" id="clearLog" type="button">지우기</button>
    </h2>
    <ol id="logList"></ol>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const state = { facilities: [], items: [], selectedItemId: null, resFacilityId: null };

// DOM 헬퍼: 사용자 입력은 textContent로만 넣는다
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(c ?? ''));
  return node;
}
const $ = (id) => document.getElementById(id);

let toastTimer;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2600);
}

function log(method, url, body, status, resBody) {
  if (method === 'GET' && !$('logGets').checked && status >= 200 && status < 300) return;
  const ok = status >= 200 && status < 300;
  const time = new Date().toLocaleTimeString();
  const pre = el('pre', {}, (body !== undefined ? '요청 ' + JSON.stringify(body) + '\n' : '') +
      '응답 ' + (typeof resBody === 'string' ? resBody : JSON.stringify(resBody, null, 2)));
  $('logList').prepend(el('li', {},
    el('div', { class: 'line' },
      el('span', { class: 'muted' }, time),
      el('span', { class: 'st ' + (ok ? 'ok' : 'err') }, status || 'ERR'),
      el('strong', {}, method), el('span', {}, url)),
    pre));
}

// 공통 요청: ApiResponse {success, message, data}에서 data를 꺼낸다
async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res, text = '', json = null;
  try {
    res = await fetch(url, opt);
    text = await res.text();
    try { json = text ? JSON.parse(text) : null; } catch { json = null; }
  } catch (e) {
    log(method, url, body, 0, String(e));
    toast('서버에 연결할 수 없습니다', true);
    throw e;
  }
  log(method, url, body, res.status, json ?? text);
  if (!res.ok) {
    const msg = (json && json.message) || (res.status + ' 오류');
    toast(msg, true);
    throw Object.assign(new Error(msg), { status: res.status });
  }
  return json ? json.data : null;
}

function formData(form) {
  const out = {};
  for (const [k, v] of new FormData(form).entries()) out[k] = v === '' ? null : v;
  return out;
}
const numOrNull = (v) => v === null || v === undefined ? null : Number(v);
const byId = (a, b) => a.id - b.id;

// ---------- 지점 ----------
async function loadFacilities() {
  state.facilities = (await api('GET', '/facilities') || []).sort(byId);
  const rows = $('facilityRows');
  rows.replaceChildren();
  if (!state.facilities.length) rows.append(el('tr', {}, el('td', { colspan: 6, class: 'empty' }, '지점이 없습니다')));
  for (const f of state.facilities) {
    const coord = f.latitude != null && f.longitude != null ? `${f.latitude}, ${f.longitude}` : '-';
    rows.append(el('tr', {},
      el('td', { class: 'num' }, f.id), el('td', {}, f.facilityName), el('td', {}, f.address),
      el('td', { class: 'num' }, coord),
      el('td', {}, el('span', { class: 'badge ' + (f.operationStatus || '') }, f.operationStatus || 'NULL')),
      el('td', {}, el('button', { class: 'small danger', type: 'button', onclick: () => deleteFacility(f) }, '삭제'))));
  }
  fillFacilitySelects();
}

function fillFacilitySelects() {
  const stockSel = $('stockFacility');
  const keepStock = stockSel.value;
  stockSel.replaceChildren(...state.facilities.map(f => el('option', { value: f.id }, `${f.id}. ${f.facilityName}`)));
  if (keepStock) stockSel.value = keepStock;

  const resSel = $('resFacility');
  resSel.replaceChildren(el('option', { value: '' }, '지점 선택'),
    ...state.facilities.map(f => el('option', { value: f.id }, `${f.id}. ${f.facilityName}`)));
  if (state.resFacilityId && state.facilities.some(f => f.id === state.resFacilityId)) resSel.value = state.resFacilityId;
}

$('facilityForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = formData(e.target);
  try {
    await api('POST', '/facilities', {
      facilityName: d.facilityName, address: d.address,
      latitude: numOrNull(d.latitude), longitude: numOrNull(d.longitude)
    });
    e.target.reset();
    toast('지점을 추가했습니다');
    await loadFacilities();
  } catch {}
});

async function deleteFacility(f) {
  if (!confirm(`${f.facilityName} 지점을 삭제할까요?`)) return;
  try { await api('DELETE', `/facilities/${f.id}`); toast('삭제했습니다'); await loadFacilities(); } catch {}
}

// ---------- 품목 ----------
async function loadItems() {
  state.items = (await api('GET', '/items') || []).sort(byId);
  const rows = $('itemRows');
  rows.replaceChildren();
  if (!state.items.length) rows.append(el('tr', {}, el('td', { colspan: 5, class: 'empty' }, '품목이 없습니다')));
  for (const it of state.items) {
    rows.append(el('tr', { class: 'clickable' + (it.id === state.selectedItemId ? ' selected' : ''), onclick: () => selectItem(it.id) },
      el('td', { class: 'num' }, it.id), el('td', {}, it.name),
      el('td', {}, it.ingredients || '-'), el('td', {}, it.storageConditions || '-'),
      el('td', {}, el('button', { class: 'small danger', type: 'button',
        onclick: (ev) => { ev.stopPropagation(); deleteItem(it); } }, '삭제'))));
  }
}

async function selectItem(id) {
  state.selectedItemId = id;
  await loadItems();
  await loadStocks();
}

$('itemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const data = await api('POST', '/items', formData(e.target));
    e.target.reset();
    toast('품목을 추가했습니다');
    state.selectedItemId = data && data.itemId ? data.itemId : state.selectedItemId;
    await loadItems();
    await loadStocks();
  } catch {}
});

async function deleteItem(it) {
  if (!confirm(`${it.name} 품목을 삭제할까요?`)) return;
  try {
    await api('DELETE', `/items/${it.id}`);
    if (state.selectedItemId === it.id) state.selectedItemId = null;
    toast('삭제했습니다');
    await loadItems(); await loadStocks();
  } catch {}
}

// ---------- 재고 ----------
async function loadStocks() {
  const rows = $('stockRows');
  rows.replaceChildren();
  const item = state.items.find(i => i.id === state.selectedItemId);
  $('stockTitle').textContent = item ? `${item.id}. ${item.name}` : '품목을 먼저 선택하세요';
  if (!item) { rows.append(el('tr', {}, el('td', { colspan: 8, class: 'empty' }, '품목을 선택하면 재고가 나옵니다'))); return; }
  //서버 목록은 정렬이 없어서 수정할 때마다 순서가 바뀔 수 있다. 화면에서는 id 순으로 고정
  const stocks = (await api('GET', `/items/${item.id}/stocks`) || []).sort(byId);
  if (!stocks.length) rows.append(el('tr', {}, el('td', { colspan: 8, class: 'empty' }, '재고가 없습니다')));
  for (const s of stocks) {
    const qty = el('input', { class: 'qty', type: 'number', min: '1', value: '1', 'aria-label': '예약 수량' });
    const key = el('input', { class: 'key', placeholder: 'idempotencyKey(선택)', 'aria-label': 'idempotencyKey' });
    rows.append(el('tr', {},
      el('td', { class: 'num' }, s.id),
      el('td', { class: 'num' }, s.onHandQty), el('td', { class: 'num' }, s.reservedQty),
      el('td', { class: 'num' }, el('strong', {}, (s.onHandQty ?? 0) - (s.reservedQty ?? 0))),
      el('td', {}, s.expirationDate || '-'),
      el('td', {}, el('span', { class: 'badge ' + (s.usageStatus || '') }, s.usageStatus || '-')),
      el('td', {}, el('div', { class: 'actions' }, qty, key,
        el('button', { class: 'small primary', type: 'button', onclick: () => reserve(s.id, qty.value, key.value) }, '예약'))),
      el('td', {}, el('div', { class: 'actions' },
        el('button', { class: 'small', type: 'button', onclick: () => editStock(s) }, '수량 수정'),
        el('button', { class: 'small', type: 'button', onclick: () => discardStock(s) }, '폐기'),
        el('button', { class: 'small danger', type: 'button', onclick: () => deleteStock(s) }, '삭제')))));
  }
}

$('stockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!state.selectedItemId) { toast('품목을 먼저 선택하세요', true); return; }
  const d = formData(e.target);
  try {
    await api('POST', `/items/${state.selectedItemId}/stocks`, {
      facilityId: numOrNull(d.facilityId), onHandQty: numOrNull(d.onHandQty), expirationDate: d.expirationDate
    });
    e.target.onHandQty.value = '';
    toast('재고를 추가했습니다');
    await loadStocks();
  } catch {}
});

async function editStock(s) {
  const v = prompt(`재고 ${s.id}의 현재 수량 (지금 ${s.onHandQty})`, s.onHandQty);
  if (v === null || v.trim() === '') return;
  try { await api('PATCH', `/stocks/${s.id}`, { onHandQty: Number(v) }); toast('수정했습니다'); await loadStocks(); } catch {}
}
async function discardStock(s) {
  if (!confirm(`재고 ${s.id}를 폐기할까요?`)) return;
  try { await api('POST', `/stocks/${s.id}/discard`); toast('폐기했습니다'); await loadStocks(); } catch {}
}
async function deleteStock(s) {
  if (!confirm(`재고 ${s.id}를 삭제할까요?`)) return;
  try { await api('DELETE', `/stocks/${s.id}`); toast('삭제했습니다'); await loadStocks(); } catch {}
}

// ---------- 예약 ----------
async function reserve(stockId, qty, key) {
  const body = { quantity: qty === '' ? null : Number(qty) };
  if (key && key.trim()) body.idempotencyKey = key.trim();
  try {
    const r = await api('POST', `/stocks/${stockId}/reservations`, body);
    toast(`예약 ${r.id} (${r.status})`);
    state.resFacilityId = r.facilityId;
    $('resFacility').value = r.facilityId;
    await loadStocks();
    await loadReservations();
  } catch {}
}

$('resFacility').addEventListener('change', async (e) => {
  state.resFacilityId = e.target.value ? Number(e.target.value) : null;
  await loadReservations();
});

// LocalDateTime 문자열(시간대 없음)을 브라우저 로컬 시각으로 읽는다. 나노초는 밀리초까지만 남긴다
const parseLocal = (s) => new Date(String(s).replace(/(\.\d{3})\d+/, '$1'));

async function loadReservations() {
  const rows = $('reservationRows');
  rows.replaceChildren();
  if (!state.resFacilityId) { rows.append(el('tr', {}, el('td', { colspan: 6, class: 'empty' }, '지점을 고르면 예약이 나옵니다'))); return; }
  const list = await api('GET', `/facilities/${state.resFacilityId}/reservations`) || [];
  if (!list.length) rows.append(el('tr', {}, el('td', { colspan: 6, class: 'empty' }, '예약이 없습니다')));
  for (const r of list) {
    rows.append(el('tr', {},
      el('td', { class: 'num' }, r.id), el('td', { class: 'num' }, r.stockId), el('td', { class: 'num' }, r.quantity),
      el('td', {}, el('span', { class: 'badge ' + r.status }, r.status)),
      el('td', { class: 'num', 'data-expires': r.status === 'HELD' ? r.expiresAt : '' },
        r.status === 'HELD' ? '' : parseLocal(r.expiresAt).toLocaleTimeString()),
      el('td', {}, el('div', { class: 'actions' },
        el('button', { class: 'small primary', type: 'button', onclick: () => act(r.id, 'confirm') }, '확정'),
        el('button', { class: 'small', type: 'button', onclick: () => act(r.id, 'reject') }, '거절'),
        el('button', { class: 'small danger', type: 'button', onclick: () => act(r.id, 'cancel') }, '취소')))));
  }
  tick();
}

async function act(id, action) {
  try {
    const r = await api('POST', `/reservations/${id}/${action}`);
    toast(`예약 ${r.id}: ${r.status}`);
    await loadReservations();
    await loadStocks();
  } catch {}
}

// HELD 예약의 남은 시간 표시
function tick() {
  for (const td of document.querySelectorAll('td[data-expires]')) {
    if (!td.dataset.expires) continue;
    const left = Math.floor((parseLocal(td.dataset.expires) - Date.now()) / 1000);
    td.textContent = left > 0
      ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} 남음`
      : '시간 지남 (정리 대기)';
  }
}
setInterval(tick, 1000);

// ---------- 공통 ----------
$('clearLog').addEventListener('click', () => $('logList').replaceChildren());
$('refreshAll').addEventListener('click', refreshAll);

async function refreshAll() {
  try {
    await loadFacilities();
