# 성능 측정용 프로필 (Redis 캐시 vs DB 조회 비교)
# 실행: Active profiles에 perf 지정. 비밀번호는 DB_PASSWORD 환경변수로만 받는다
spring.datasource.url=jdbc:postgresql://localhost:5432/stockdspr_perf
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# SQL 로그 출력이 응답 시간에 섞이지 않게 끈다
spring.jpa.show-sql=false
